<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelAir | Agencia de Viajes</title>
    <link rel="stylesheet" href="Css/viajes.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">✈ TravelAir</a>
    <ul class="nav-menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="#destinos">Destinos</a></li>
    </ul>
</nav>

<header id="inicio" class="hero">

<div class="hero-content">

    <h1>Descubre el Mundo</h1>

    <p>Encuentra destinos increíbles para tus próximas vacaciones.</p>

    <div class="search-box">

        <input type="text" id="origen" placeholder="Origen">

        <input type="text" id="destino" placeholder="Destino">

        <button onclick="buscarVuelos()">
            Buscar Vuelos
        </button>

    </div>

</div>

</header>

<section>

<div class="section-title">
    <h2>Vuelos Disponibles</h2>
</div>

<div id="resultados" class="resultados"></div>

</section>

<section id="destinos">

<div class="section-title">
    <h2>Destinos Populares</h2>
</div>

<div class="cards-grid">

    <div class="card" onclick="mostrarDestino('cancun')">

        <img src="https://images.unsplash.com/photo-1552074284-5e88ef1aef18">

        <div class="card-info">
            <h3>Cancún 🇲🇽</h3>
            <p>Playas paradisíacas.</p>
            <span>⭐ 4.8</span>
        </div>

    </div>

    <div class="card" onclick="mostrarDestino('paris')">

        <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a">

        <div class="card-info">
            <h3>París 🇫🇷</h3>
            <p>La ciudad del amor.</p>
            <span>⭐ 4.9</span>
        </div>

    </div>

    <div class="card" onclick="mostrarDestino('tokio')">

        <img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf">

        <div class="card-info">
            <h3>Tokio 🇯🇵</h3>
            <p>Tecnología y tradición.</p>
            <span>⭐ 4.9</span>
        </div>

    </div>

</div>

</section>

<div id="modal" class="modal">

<div class="modal-content">

    <span class="close" onclick="cerrarModal()">
        &times;
    </span>

    <div id="detalleDestino"></div>

</div>

</div>

<footer>
    <p>© 2026 TravelAir</p>
</footer>

<script src="script.js"></script>

</body>
</html>
