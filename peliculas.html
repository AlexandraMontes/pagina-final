<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link href="https://fonts.cdnfonts.com/css/blade-runner-movie-font" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/archicoco" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/oleo" rel="stylesheet">
    <link rel="stylesheet" href="css/estilopelicula.css">
    <title>Peliculas</title>
</head>
<body>
<a href="index.html" class="btnInicio">Volver al inicio</a>
<div class="container">
    <h1>Pagina de Peliculas</h1>
    <p class="subtitulo">
        Proyecto API del tercer parcial
    </p>
    <h3>Alexandra Montes</h3>
<form id="form">
    <input type="text" id="search" placeholder="La Razón De Estar Contigo">
    <input type="submit" value="Buscar">
</form>
<section id="main" class="movies"></section>
</div>


<script>
    //En esta línea se define la URL de la API para obtener la lista de películas.
    const API_URL = 'https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=3fd2be6f0c70a2a598f084ddfb75487c&page=1';
    //Esta línea define la URL de la API para obtener las imágenes de las películas.
    const IMG_PATH = 'https://image.tmdb.org/t/p/w1280';
    //En esta línea se define la URL de la API para buscar películas.
    const SEARCH_API = 'https://api.themoviedb.org/3/search/movie?api_key=3fd2be6f0c70a2a598f084ddfb75487c&query=';

    const main = document.getElementById('main');
    const form = document.getElementById('form');
    const search = document.getElementById('search');

    getMovie(API_URL);
    async function getMovie(url) {
        const res = await fetch(url);
        const data = await res.json();
        showMovies(data.results);
    }
    // Esta función crea los elementos del HTML para mostrar cada película en la lista.
    function showMovies(movies){
        main.innerHTML = '';
        movies.forEach((movie) => {
            const {title, poster_path, vote_average, overview, release_date} = movie;
            const movieEl = document.createElement('div');

            movieEl.classList.add('movie');
            movieEl.innerHTML = `
            <img src="${IMG_PATH + poster_path}" alt="{title}">
            <div class="movie-info">
                <h3>${title}</h3>
                <span class="${getClassByRate(vote_average)}">${vote_average}</span>
                </div>
                
                 <div class="overview">
                    <h3>Overview</h3>
                    ${overview}
                    <h3>Release Date</h3>
                    ${release_date}</div>
                    `
                    main.appendChild(movieEl);
                })
            }
            function getClassByRate(vote){
                if(vote>=8){
                    return 'green'
                } else if(vote>=5){
                    return 'orange'
                } else { return 'red'}
            }
            form.addEventListener('submit', (e) =>{
                e.preventDefault();
                const searchTerm = search.value
                if(searchTerm && searchTerm !==''){
                    getMovie(SEARCH_API + searchTerm)
                    search.value = ''
                }else{
                    window.location.reload();
                }
            });
</script>

</body>
</html>
